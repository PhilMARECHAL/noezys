<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Noezys — pub 30s (script flyers v3)</title>
<style>
  @font-face { font-family:'Outfit'; font-weight:300; src:url('fonts/outfit-300.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:400; src:url('fonts/outfit-400.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:500; src:url('fonts/outfit-500.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:700; src:url('fonts/outfit-700.woff2') format('woff2'); }

  :root {
    --bg-deep:#0A0E1A; --bg-mid:#0D1225;
    --cyan:#00D4FF; --purple:#8B5CF6;
    --text:#F0F3FA; --text2:#8A96B4;
    --light:#E9EDF4; --ink:#0B0F1E;
    --green:#55B97E;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#000; }
  body { font-family:'Outfit',sans-serif; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:#000; }
  .scene { position:absolute; inset:0; display:none; overflow:hidden; }
  .scene.active { display:block; }
  .grad-text {
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }
  .center-wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .w { display:inline-block; opacity:0; white-space:pre; }

  /* S1 ouverture — dark kinetic */
  #s1 { background:var(--bg-deep); }
  #s1 .line { text-align:center; color:var(--text); font-weight:700; font-size:132px; line-height:1.16; letter-spacing:-2px; }

  /* S2 mission — light + mark */
  #s2 { background:linear-gradient(160deg,#F2F4F8,#DDE2EC); }
  #s2 .row { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:90px; padding:0 120px; }
  #s2 .mark { width:280px; height:280px; opacity:0; flex:0 0 auto; filter:drop-shadow(0 40px 60px rgba(10,14,26,.25)); }
  #s2 .txt { font-size:92px; font-weight:600; color:var(--ink); letter-spacing:-1px; max-width:1150px; line-height:1.25; }
  #s2 .w { margin-right:0.24em; }

  /* S3 logo reveal */
  #s3 { background:radial-gradient(ellipse at 50% 38%,var(--bg-mid) 0%,var(--bg-deep) 70%); }
  #s3 .mark { width:250px; height:250px; opacity:0;
              filter:drop-shadow(0 0 50px rgba(0,212,255,.35)) drop-shadow(0 0 110px rgba(139,92,246,.3)); }
  #s3 .name { margin-top:46px; font-size:140px; font-weight:600; color:var(--text); opacity:0; }
  #s3 .divider { margin-top:32px; height:3px; width:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:2px; }
  #s3 .sub { margin-top:28px; font-size:38px; font-weight:400; color:var(--text2); letter-spacing:14px; opacity:0; }

  /* S4 cartes */
  .case { position:absolute; inset:0; display:none; }
  .case.on { display:block; }
  #s4 { background:var(--bg-deep); }
  #s4 .glowbg { position:absolute; inset:0; }
  .case .inner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:80px; padding:0 160px; }
  .case .num { font-size:230px; font-weight:700; opacity:0; flex:0 0 auto; line-height:1; }
  .case .sep { width:3px; height:340px; background:linear-gradient(180deg,var(--cyan),var(--purple)); border-radius:2px; opacity:0; }
  .case .txt { max-width:1080px; }
  .case .head { font-size:86px; font-weight:600; color:var(--text); line-height:1.18; letter-spacing:-1px; opacity:0; }
  .case .sub { margin-top:26px; font-size:46px; font-weight:300; color:var(--text2); line-height:1.35; opacity:0; }
  .case .sub .grad-text { font-weight:400; }

  /* S5 équipe — light */
  #s5 { background:linear-gradient(160deg,#F2F4F8,#DDE2EC); }
  #s5 .label { font-size:30px; font-weight:500; color:#5A6580; letter-spacing:12px; opacity:0; }
  #s5 .values { margin-top:44px; font-size:104px; font-weight:700; color:var(--ink); letter-spacing:-1px; }
  #s5 .values .w { margin-right:0.3em; }
  #s5 .sig { margin-top:48px; font-size:76px; font-weight:600; opacity:0; }

  /* S6 carte finale */
  #s6 { background:
        radial-gradient(ellipse 900px 600px at 12% 88%,rgba(139,92,246,.16),transparent 60%),
        radial-gradient(ellipse 900px 600px at 88% 12%,rgba(0,212,255,.14),transparent 60%),
        var(--bg-deep); }
  #s6 .dot { position:absolute; border-radius:50%; background:#9FB6FF; }
  #s6 .mark { width:130px; height:130px; opacity:0;
              filter:drop-shadow(0 0 40px rgba(0,212,255,.3)) drop-shadow(0 0 90px rgba(139,92,246,.25)); }
  #s6 .name { margin-top:22px; font-size:80px; font-weight:600; color:var(--text); opacity:0; }
  #s6 .divider { margin-top:20px; height:3px; width:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); border-radius:2px; }
  #s6 .cta { margin-top:28px; font-size:48px; font-weight:500; color:var(--text); opacity:0; }
  #s6 .qrrow { margin-top:34px; display:flex; align-items:center; gap:42px; }
  #s6 .qrcard { width:230px; height:230px; background:#fff; border-radius:22px; padding:15px; opacity:0;
                box-shadow:0 0 50px rgba(0,212,255,.2), 0 24px 60px rgba(0,0,0,.5); }
  #s6 .qrcard img { display:block; width:100%; height:100%; }
  #s6 .qrside { text-align:left; }
  #s6 .scanlabel { font-size:28px; font-weight:500; color:var(--text2); letter-spacing:2px; opacity:0; }
  #s6 .url { margin-top:12px; font-size:46px; font-weight:600; opacity:0; }
  #s6 .eco { margin-top:30px; font-size:24px; font-weight:500; color:var(--green); letter-spacing:6px; opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1"><div class="center-wrap" id="s1group"></div></div>

  <div class="scene" id="s2">
    <div class="row">
      <img class="mark" id="s2mark" src="../assets/noezys-n-mark.png" alt="">
      <div class="txt" id="s2txt"></div>
    </div>
  </div>

  <div class="scene" id="s3">
    <div class="center-wrap">
      <img class="mark" id="s3mark" src="../assets/noezys-n-mark.png" alt="">
      <div class="name">NOEZYS</div>
      <div class="divider" id="s3div"></div>
      <div class="sub" id="s3sub">AI INNOVATION LAB</div>
    </div>
  </div>

  <div class="scene" id="s4">
    <div class="glowbg" id="s4glow"></div>
    <div class="case" id="case0"><div class="inner">
      <div class="num grad-text">01</div><div class="sep"></div>
      <div class="txt"><div class="head"></div><div class="sub"></div></div>
    </div></div>
    <div class="case" id="case1"><div class="inner">
      <div class="num grad-text">02</div><div class="sep"></div>
      <div class="txt"><div class="head"></div><div class="sub"></div></div>
    </div></div>
  </div>

  <div class="scene" id="s5">
    <div class="center-wrap">
      <div class="label" id="s5label"></div>
      <div class="values" id="s5values"></div>
      <div class="sig grad-text" id="s5sig"></div>
    </div>
  </div>

  <div class="scene" id="s6">
    <div id="s6dots"></div>
    <div class="center-wrap" id="s6group">
      <img class="mark" id="s6mark" src="../assets/noezys-n-mark.png" alt="">
      <div class="name">NOEZYS</div>
      <div class="divider" id="s6div"></div>
      <div class="cta" id="s6cta"></div>
      <div class="qrrow">
        <div class="qrcard" id="s6qr"><img id="s6qrimg" src="" alt="QR code"></div>
        <div class="qrside">
          <div class="scanlabel" id="s6scan"></div>
          <div class="url grad-text" id="s6url"></div>
        </div>
      </div>
      <div class="eco" id="s6eco"></div>
    </div>
  </div>
</div>

<script>
/* ═══ copy v3 — validée par le client (script flyers) ═══ */
const LANG=(new URLSearchParams(location.search).get('lang'))||'fr';
const COPY={
 fr:{
  s1:[[["L'intelligence ",true],["artificielle,",true]],[["intégrée "],["à "],["votre "],["métier."]]],
  s2:[[["Gagner "],["du "],["temps."]],[["Faire "],["grandir "],["votre "],["chiffre d'affaires.",true]]],
  cases:[
   {head:'Des solutions <span class="grad-text">sur mesure</span> pour vous.',
    sub:"Site web, logiciel, applications mobiles, avec le meilleur de l'IA."},
   {head:'Pas seulement une IA.',
    sub:'Une <span class="grad-text">vraie équipe</span> qui vous écoute et vous accompagne.'},
  ],
  label:"L'ÉQUIPE NOEZYS",
  values:["Authenticité.","Impact.","Créativité."],
  sig:"Le contact humain avant tout.",
  cta:"30 minutes. Un plan d'action concret. Sans engagement.",
  scan:"Scannez pour découvrir",
  url:"noezys.com/fr/lab",
  qr:"qr-fr.png",
  eco:"SOLUTIONS DIGITALES DURABLES · IA RESPONSABLE",
 },
 en:{
  s1:[[["Artificial ",true],["intelligence,",true]],[["built "],["into "],["your "],["business."]]],
  s2:[[["Save "],["time."]],[["Grow "],["your "],["revenue.",true]]],
  cases:[
   {head:'Solutions built around <span class="grad-text">you</span>.',
    sub:"Websites, software and mobile apps that put AI to work for you."},
   {head:'Not just AI.',
    sub:'A <span class="grad-text">real team</span> that listens and stays by your side.'},
  ],
  label:"THE NOEZYS TEAM",
  values:["Authenticity.","Impact.","Creativity."],
  sig:"Human connection comes first.",
  cta:"30 minutes. A clear action plan. No strings attached.",
  scan:"Scan to discover",
  url:"noezys.com/en/lab",
  qr:"qr-en.png",
  eco:"SUSTAINABLE DIGITAL SOLUTIONS · RESPONSIBLE AI",
 },
}[LANG];

/* build word-pop lines: array of lines, each line = array of [word, gradient?] */
function buildLines(container, lines, lineClass){
  lines.forEach(line=>{
    const d=document.createElement('div'); if(lineClass) d.className=lineClass;
    line.forEach(w=>{
      const s=document.createElement('span'); s.className='w'+(w[1]?' grad-text':'');
      s.textContent=w[0]; d.appendChild(s);
    });
    container.appendChild(d);
  });
}
buildLines(document.getElementById('s1group'), COPY.s1, 'line');
buildLines(document.getElementById('s2txt'), COPY.s2);
const s1words=[...document.querySelectorAll('#s1 .w')];
const s2words=[...document.querySelectorAll('#s2 .w')];

COPY.cases.forEach((c,i)=>{
  const el=document.getElementById('case'+i);
  el.querySelector('.head').innerHTML=c.head;
  el.querySelector('.sub').innerHTML=c.sub;
});

document.getElementById('s5label').textContent=COPY.label;
const valWrap=document.getElementById('s5values');
COPY.values.forEach(v=>{
  const s=document.createElement('span'); s.className='w'; s.textContent=v+' ';
  valWrap.appendChild(s);
});
const valWords=[...valWrap.children];
document.getElementById('s5sig').textContent=COPY.sig;
document.getElementById('s6cta').textContent=COPY.cta;
document.getElementById('s6scan').textContent=COPY.scan;
document.getElementById('s6url').textContent=COPY.url;
document.getElementById('s6qrimg').src=COPY.qr;
document.getElementById('s6eco').textContent=COPY.eco;

/* particles finale */
const dotsWrap=document.getElementById('s6dots');
const DOTS=[];
for(let i=0;i<42;i++){
  const r1=Math.abs(Math.sin(i*127.1))%1, r2=Math.abs(Math.sin(i*311.7))%1, r3=Math.abs(Math.sin(i*74.3))%1;
  const d=document.createElement('div'); d.className='dot';
  const size=1.5+r3*3; d.style.width=size+'px'; d.style.height=size+'px';
  dotsWrap.appendChild(d);
  DOTS.push({el:d,x:r1*1920,y:r2*1080,ph:i*0.7,sp:0.3+r3*0.5,amp:14+r1*22});
}

/* ═══ engine ═══ */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const nrm=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const outExpo=p=>p>=1?1:1-Math.pow(2,-10*p);
const outBack=p=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const outCubic=p=>1-Math.pow(1-p,3);
function pop(el,t,t0,dur=0.32){
  const p=nrm(t,t0,t0+dur), e=outExpo(p);
  el.style.opacity=p<=0?0:e;
  el.style.transform=`scale(${1.9-0.9*e})`;
  el.style.filter=`blur(${(1-e)*10}px)`;
}
const S=id=>document.getElementById(id);
const CASE_HUES=['rgba(0,212,255,.10)','rgba(139,92,246,.12)'];

/* ═══ timeline v3 : 0-4-7.5-11-15-19-25-30 ═══ */
const scenes=[
 /* S1 ouverture 0–4.0 */
 {id:'s1',a:0,b:4.0,update(t){
   s1words.forEach((w,i)=>pop(w,t,0.15+i*0.35));
   S('s1group').style.transform=`scale(${1+0.05*nrm(t,0,4.0)})`;
 }},
 /* S2 mission 4.0–7.5 */
 {id:'s2',a:4.0,b:7.5,update(t){
   const lt=t-4.0;
   const m=S('s2mark');
   const p=nrm(lt,0.05,0.8), e=outBack(outCubic(p));
   m.style.opacity=p<=0?0:1;
   m.style.transform=`translateY(${-750+750*e}px) rotate(${-70+82*e}deg)`;
   s2words.forEach((w,i)=>pop(w,lt,0.4+i*0.22,0.3));
 }},
 /* S3 logo 7.5–11.0 */
 {id:'s3',a:7.5,b:11.0,update(t){
   const lt=t-7.5;
   const m=S('s3mark');
   const p=nrm(lt,0.05,0.65), e=outBack(outCubic(p));
   m.style.opacity=p<=0?0:1; m.style.transform=`scale(${0.3+0.7*e})`;
   const nm=document.querySelector('#s3 .name');
   const p2=outExpo(nrm(lt,0.5,1.4));
   nm.style.opacity=p2; nm.style.letterSpacing=(70-56*p2)+'px'; nm.style.paddingLeft=(70-56*p2)+'px';
   S('s3div').style.width=(outCubic(nrm(lt,0.9,1.7))*420)+'px';
   S('s3sub').style.opacity=outCubic(nrm(lt,1.2,2.0));
 }},
 /* S4 cartes 11.0–19.0 (2 × 4 s) */
 {id:'s4',a:11.0,b:19.0,update(t){
   const lt=t-11.0;
   const idx=clamp(Math.floor(lt/4),0,1);
   [0,1].forEach(i=>S('case'+i).classList.toggle('on',i===idx));
   S('s4glow').style.background=`radial-gradient(ellipse 1200px 800px at ${35+idx*30}% 50%,${CASE_HUES[idx]},transparent 65%)`;
   const ct=lt-idx*4;
   const c=S('case'+idx);
   const num=c.querySelector('.num'), sep=c.querySelector('.sep'),
         head=c.querySelector('.head'), sub=c.querySelector('.sub');
   const pn=nrm(ct,0.05,0.5), en=outBack(outCubic(pn));
   num.style.opacity=pn<=0?0:1; num.style.transform=`scale(${0.5+0.5*en})`;
   const ps=outCubic(nrm(ct,0.25,0.8));
   sep.style.opacity=ps; sep.style.transform=`scaleY(${ps})`;
   const ph=outExpo(nrm(ct,0.35,1.0));
   head.style.opacity=ph; head.style.transform=`translateX(${(1-ph)*60}px)`;
   const pu=outCubic(nrm(ct,0.8,1.5));
   sub.style.opacity=pu; sub.style.transform=`translateX(${(1-pu)*40}px)`;
 }},
 /* S5 équipe 19.0–25.0 */
 {id:'s5',a:19.0,b:25.0,update(t){
   const lt=t-19.0;
   const lb=S('s5label');
   const p=outCubic(nrm(lt,0.15,0.9));
   lb.style.opacity=p; lb.style.transform=`translateY(${(1-p)*20}px)`;
   valWords.forEach((w,i)=>pop(w,lt,0.9+i*0.75,0.4));
   const sg=S('s5sig');
   const p2=outExpo(nrm(lt,3.4,4.2));
   sg.style.opacity=p2; sg.style.transform=`translateY(${(1-p2)*30}px) scale(${0.9+0.1*p2})`;
 }},
 /* S6 finale 25.0–30.0 */
 {id:'s6',a:25.0,b:30.01,update(t){
   const lt=t-25.0;
   DOTS.forEach(d=>{
     d.el.style.left=(d.x+Math.sin(lt*d.sp+d.ph)*d.amp)+'px';
     d.el.style.top=(d.y+Math.cos(lt*d.sp*0.8+d.ph)*d.amp)+'px';
     d.el.style.opacity=0.15+0.25*Math.abs(Math.sin(lt*0.8+d.ph));
   });
   const m=S('s6mark');
   const p=nrm(lt,0.05,0.6), e=outBack(outCubic(p));
   m.style.opacity=p<=0?0:1; m.style.transform=`scale(${0.4+0.6*e})`;
   const nm=document.querySelector('#s6 .name');
   const p2=outExpo(nrm(lt,0.35,1.0));
   nm.style.opacity=p2; nm.style.transform=`translateY(${(1-p2)*25}px)`;
   S('s6div').style.width=(outCubic(nrm(lt,0.6,1.2))*380)+'px';
   const p3=outExpo(nrm(lt,0.9,1.7));
   S('s6cta').style.opacity=p3; S('s6cta').style.transform=`translateY(${(1-p3)*20}px)`;
   const pq=nrm(lt,1.4,2.0), eq=outBack(outCubic(pq));
   const qr=S('s6qr');
   qr.style.opacity=pq<=0?0:1; qr.style.transform=`scale(${0.5+0.5*eq}) rotate(${(1-eq)*-8}deg)`;
   const p4=outExpo(nrm(lt,1.7,2.4));
   S('s6scan').style.opacity=p4;
   const url=S('s6url');
   url.style.opacity=p4; url.style.transform=`scale(${0.85+0.15*p4})`;
   S('s6eco').style.opacity=outCubic(nrm(lt,2.2,3.0));
   S('s6group').style.transform=`translateY(${Math.sin(lt*0.9)*6}px)`;
 }},
];

window.seek=function(t){
  scenes.forEach(sc=>{
    const on=t>=sc.a&&t<sc.b;
    S(sc.id).classList.toggle('active',on);
    if(on)sc.update(t);
  });
};
window.seek(0);
</script>
</body>
</html>
