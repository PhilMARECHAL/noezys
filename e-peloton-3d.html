<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Peloton Sync AI — Vue 3D · Noezys</title>
<meta name="theme-color" content="#0A0420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0420;--deep:#140A38;--panel:rgba(20,12,54,.62);--stroke:rgba(150,120,255,.2);--stroke-hi:rgba(150,120,255,.4);
  --cyan:#00E5FF;--mag:#FF2EC4;--violet:#8B5CFF;--lime:#B6FF3C;--amber:#FFC24B;--danger:#FF5470;
  --grad:linear-gradient(110deg,var(--cyan),var(--mag));--txt:#F2EEFF;--txt2:#A99FD6;--txt3:#6B6097;
  --mono:'JetBrains Mono',monospace;--font:'Outfit',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
  --sky1:#1A0B4D;--sky2:#2E1066;--sky3:#5B1A7A;--sky4:#8A1E63;--road1:#241046;--road2:#160a2e;
}
body.day{
  --void:#E9EDFC;--deep:#fff;--panel:rgba(255,255,255,.72);--stroke:rgba(60,40,120,.16);--stroke-hi:rgba(60,40,120,.32);
  --txt:#16123A;--txt2:#564E7E;--txt3:#8C84B0;
  --sky1:#9FC7FF;--sky2:#BBD4FF;--sky3:#FFD0E6;--sky4:#FFE3B0;--road1:#5A5277;--road2:#3E3860;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--void);color:var(--txt);min-height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:16px;padding:13px 22px;background:linear-gradient(180deg,rgba(14,7,48,.9),rgba(14,7,48,.4));
  border-bottom:1px solid var(--stroke);position:relative;z-index:30;backdrop-filter:blur(12px)}
body.day .top{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.5))}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;font-weight:900;color:#0A0420;background:var(--grad);box-shadow:0 0 20px rgba(255,46,196,.5)}
.brand b{font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;line-height:1}
.brand small{font-size:9.5px;color:var(--txt3);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.back{font-size:12px;color:var(--txt2);padding:6px 11px;border:1px solid var(--stroke);border-radius:8px}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(0,229,255,.1);border:1px solid var(--stroke-hi);font-family:var(--mono);font-weight:700;font-size:13px;color:var(--cyan)}
.pill .l{font-family:var(--font);font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;display:block;font-weight:700}

/* SCENE */
.scene{position:absolute;inset:62px 0 0 0;overflow:hidden;perspective:760px;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 30%,var(--sky3) 58%,var(--sky4) 80%, #B0265A 100%)}
.sun{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,#FFD24B,#FF7AB8 50%,transparent 70%);opacity:.8;filter:blur(1px)}
.stars{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(1px 1px at 25% 14%,#fff,transparent),radial-gradient(1px 1px at 65% 10%,#fff,transparent),radial-gradient(1px 1px at 80% 22%,#fff,transparent),radial-gradient(1px 1px at 45% 18%,#fff,transparent)}
body.day .stars{display:none}
/* mountains */
.mtn{position:absolute;left:0;right:0;bottom:46%;height:160px}
.mtn svg{width:100%;height:100%}
/* perspective road plane */
.floor{position:absolute;left:50%;bottom:0;width:260%;height:130%;transform:translateX(-50%) rotateX(74deg);transform-origin:bottom center;
  background:linear-gradient(180deg,var(--road1),var(--road2));overflow:hidden}
.floor::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 46%,rgba(0,229,255,.55) 46% 54%,transparent 54% 100%)0 0/100% 90px,
             repeating-linear-gradient(0deg,rgba(150,120,255,.12) 0 2px,transparent 2px 88px);
  animation:roll 1.1s linear infinite}
@keyframes roll{from{background-position:0 0,0 0}to{background-position:0 90px,0 88px}}
.floor::after{content:"";position:absolute;left:8%;right:8%;top:0;bottom:0;
  border-left:3px solid rgba(255,46,196,.4);border-right:3px solid rgba(255,46,196,.4)}
/* fog at horizon */
.fog{position:absolute;left:0;right:0;bottom:44%;height:90px;z-index:5;
  background:linear-gradient(180deg,transparent,var(--sky4));opacity:.5;pointer-events:none}

/* riders layer */
.field{position:absolute;inset:0;z-index:8}
.rider{position:absolute;left:50%;transition:all 1.4s var(--ease);will-change:transform}
.rider .tag{position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
.rider .tag .nm{font-size:11px;font-weight:800;color:#0A0420;padding:2px 7px;border-radius:6px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.rider .tag .pw{display:block;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--txt);margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rider .tag .pw .e{color:var(--cyan)}
.bob{animation:bob .5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.boost{transform-box:fill-box;transform-origin:center;animation:bp .4s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:.5}50%{opacity:1}}
.legp{transform-box:fill-box;transform-origin:top center;animation:lp .5s ease-in-out infinite alternate}
@keyframes lp{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

/* HUD */
.hud{position:absolute;left:18px;top:16px;display:flex;gap:9px;flex-wrap:wrap;z-index:20}
.h{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;background:rgba(10,4,32,.72);border:1px solid var(--stroke);backdrop-filter:blur(8px);font-size:12px;font-weight:600}
body.day .h{background:rgba(255,255,255,.78)}
.h b{font-family:var(--mono);color:var(--cyan)}
.legend{position:absolute;right:18px;top:16px;z-index:20;display:flex;gap:14px;padding:8px 14px;border-radius:10px;background:rgba(10,4,32,.7);border:1px solid var(--stroke);font-size:11px;color:var(--txt2);backdrop-filter:blur(8px)}
body.day .legend{background:rgba(255,255,255,.8)}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

/* bottom allocation */
.alloc{position:absolute;left:18px;bottom:18px;z-index:20;display:flex;gap:9px;align-items:flex-end;
  padding:13px 15px;border-radius:15px;background:rgba(10,4,32,.74);border:1px solid var(--stroke-hi);backdrop-filter:blur(10px)}
body.day .alloc{background:rgba(255,255,255,.82)}
.alloc .cap{position:absolute;top:-26px;left:2px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.ab{display:flex;flex-direction:column;align-items:center;gap:5px;width:54px}
.ab .bar{width:26px;height:72px;border-radius:7px;background:rgba(150,120,255,.12);border:1px solid var(--stroke);display:flex;align-items:flex-end;overflow:hidden}
.ab .bar i{width:100%;border-radius:6px;transition:height 1s var(--ease)}
.ab .w{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--cyan)}
.ab .nm{font-size:10px;font-weight:700}

/* theme toggle */
.tg{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--stroke);background:var(--panel);font-size:12px;font-weight:600;color:var(--txt2)}
.tg svg{width:16px;height:16px}
</style>
</head>
<body>
  <header class="top">
    <div class="logo">⚡</div>
    <div class="brand"><b>E-Peloton Sync AI</b><small>Vue 3D · peloton en immersion</small></div>
    <a class="back" href="e-peloton-app.html">← Hub</a>
    <div class="sp"></div>
    <div class="pill"><span><span class="l">Allure groupe</span><span id="gs">31.4 km/h</span></span></div>
    <div class="pill" style="background:rgba(182,255,60,.1);color:var(--lime)"><span><span class="l">Cohésion</span><span id="coh">98%</span></span></div>
    <button class="tg" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg><span id="theme-l">Mode jour</span></button>
  </header>

  <div class="scene">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="mtn">
      <svg viewBox="0 0 1200 160" preserveAspectRatio="none"><path d="M0 160 L0 90 L120 40 L240 95 L360 30 L520 100 L680 45 L840 95 L1000 35 L1140 90 L1200 70 L1200 160Z" fill="rgba(58,26,110,.85)"/></svg>
    </div>
    <div class="floor"></div>
    <div class="fog"></div>

    <div class="hud">
      <span class="h"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="var(--cyan)" stroke-width="1.8"><path d="M3 18l5-9 4 5 3-4 6 8"/></svg>Pente <b id="grade">8.1%</b></span>
      <span class="h"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="var(--mag)" stroke-width="1.8"><path d="M3 8h12a3 3 0 100-6"/></svg>Vent <b style="color:var(--mag)">12↗</b></span>
      <span class="h"><svg viewBox="0 0 24 24" width="15" fill="none" stroke="var(--lime)" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M2 12h3"/></svg>km <b style="color:var(--lime)">34.2/72</b></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--lime)"></i>En tête</span>
      <span><i style="background:var(--cyan)"></i>Groupe</span>
      <span><i style="background:var(--violet)"></i>Soutenu IA</span>
    </div>

    <div class="field" id="field"></div>

    <div class="alloc" id="alloc"><span class="cap">⚡ Assistance moteur allouée (W)</span></div>
  </div>

<script>
(function(){
  "use strict";
  const $=(s,r=document)=>r.querySelector(s);
  const params=new URLSearchParams(location.search);
  if(params.get('theme')==='day')document.body.classList.add('day');

  const riders=[
    // depth: 0 = proche caméra (plus gros/bas), 1 = loin (petit/haut, vers le point de fuite)
    {id:'lea', name:'Léa', num:'5',jc:'#8B5CFF',depth:0.04,lane:-0.55,pw:198,motorW:245,batt:71},
    {id:'sara',name:'Sara',num:'4',jc:'#FF2EC4',depth:0.16,lane: 0.42,pw:226,motorW:150,batt:79},
    {id:'paul',name:'Paul',num:'3',jc:'#FFC24B',depth:0.30,lane:-0.30,pw:212,motorW:165,batt:76},
    {id:'marc',name:'Marc',num:'2',jc:'#00E5FF',depth:0.46,lane: 0.20,pw:262,motorW:95, batt:84},
    {id:'theo',name:'Théo',num:'1',jc:'#B6FF3C',depth:0.62,lane:-0.05,pw:286,motorW:40, batt:90},
  ];
  const motorMax=350;

  /* cycliste vu de dos */
  function backSVG(jc,num){
    return `<svg viewBox="0 0 110 150" width="110" style="display:block;overflow:visible">
      <defs><radialGradient id="bg${num}"><stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset="1" stop-color="#FF2EC4" stop-opacity=".6"/></radialGradient></defs>
      <ellipse class="boost" cx="55" cy="132" rx="38" ry="11" fill="url(#bg${num})"/>
      <!-- roue arrière vue de dos -->
      <ellipse cx="55" cy="124" rx="11" ry="28" fill="none" stroke="#0A0420" stroke-width="6"/>
      <ellipse cx="55" cy="124" rx="11" ry="28" fill="none" stroke="#C9BEF5" stroke-width="2"/>
      <line x1="55" y1="96" x2="55" y2="152" stroke="#6B6097" stroke-width="1.4"/>
      <!-- jambes qui pédalent -->
      <line class="legp" x1="44" y1="92" x2="40" y2="120" stroke="#1a1030" stroke-width="9" stroke-linecap="round"/>
      <line class="legp" x1="66" y1="92" x2="70" y2="120" stroke="#1a1030" stroke-width="9" stroke-linecap="round" style="animation-delay:-.25s"/>
      <!-- selle/hanches -->
      <ellipse cx="55" cy="92" rx="17" ry="8" fill="#0A0420"/>
      <!-- maillot (dos) -->
      <path d="M33 88 Q55 80 77 88 L70 50 Q55 42 40 50 Z" fill="${jc}"/>
      <path d="M40 50 Q55 42 70 50 L68 60 Q55 53 42 60 Z" fill="rgba(10,4,32,.18)"/>
      <!-- dossard -->
      <rect x="46" y="60" width="18" height="16" rx="3" fill="#fff" opacity=".92"/>
      <text x="55" y="73" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="13" fill="#0A0420">${num}</text>
      <!-- bras -->
      <path d="M37 54 L24 78" stroke="#E8C6A0" stroke-width="7" stroke-linecap="round"/>
      <path d="M73 54 L86 78" stroke="#E8C6A0" stroke-width="7" stroke-linecap="round"/>
      <!-- épaules + casque (vu de dos) -->
      <ellipse cx="55" cy="40" rx="15" ry="10" fill="${jc}"/>
      <ellipse cx="55" cy="30" rx="13" ry="12" fill="#0A0420"/>
      <path d="M44 28 q11 -9 22 0 q-3 -3 -11 -3 -8 0 -11 3z" fill="${jc}"/>
      <line x1="49" y1="22" x2="49" y2="34" stroke="${jc}" stroke-width="2"/><line x1="55" y1="20" x2="55" y2="34" stroke="${jc}" stroke-width="2"/><line x1="61" y1="22" x2="61" y2="34" stroke="${jc}" stroke-width="2"/>
    </svg>`;
  }

  function place(){
    $('#field').innerHTML=riders.map(r=>{
      const scale=(0.45+(1-r.depth)*0.95).toFixed(2);
      const bottom=(14+r.depth*42).toFixed(1);              // loin = plus haut
      const left=(50+r.lane*38*(1-r.depth*0.55)).toFixed(1);// loin = plus resserré
      const z=Math.round((1-r.depth)*100);
      const opacity=(1-r.depth*0.32).toFixed(2);
      return `<div class="rider" data-id="${r.id}" style="bottom:${bottom}%;left:${left}%;transform:translateX(-50%) scale(${scale});z-index:${z};opacity:${opacity}">
        <div class="tag"><span class="nm" style="background:${r.jc}">${r.name}</span><span class="pw">${r.pw}W <span class="e">+${r.motorW}⚡</span></span></div>
        <div class="bob">${backSVG(r.jc,r.num)}</div>
      </div>`;
    }).join('');
    // aura dimensionnée selon assistance
    $('#field').querySelectorAll('.rider').forEach(el=>{
      const r=riders.find(x=>x.id===el.dataset.id);
      const b=el.querySelector('.boost');
      if(b){b.style.transformOrigin='55px 124px';b.style.transform='scale('+(0.6+r.motorW/motorMax).toFixed(2)+')';}
    });
  }
  place();

  function alloc(){
    const order=[...riders].sort((a,b)=>b.depth-a.depth); // tête à gauche
    $('#alloc').innerHTML='<span class="cap">⚡ Assistance moteur allouée (W)</span>'+order.map(r=>{
      const h=(r.motorW/motorMax*100).toFixed(0);
      return `<div class="ab"><div class="bar"><i style="height:${h}%;background:${r.jc}"></i></div><span class="w">${r.motorW}</span><span class="nm" style="color:${r.jc}">${r.name}</span></div>`;
    }).join('');
  }
  alloc();

  /* live */
  const jit=(v,a)=>v+(Math.random()*2-1)*a;
  setInterval(()=>{
    riders.forEach(r=>{
      r.pw=Math.round(jit(r.pw,7));r.motorW=Math.max(20,Math.round(jit(r.motorW,9)));
      const t=$(`.rider[data-id="${r.id}"] .pw`);
      if(t)t.innerHTML=r.pw+'W <span class="e">+'+r.motorW+'⚡</span>';
    });
    $('#gs').textContent=jit(31.4,.25).toFixed(1)+' km/h';
    $('#coh').textContent=Math.min(99,Math.round(jit(98,1)))+'%';
    $('#grade').textContent=jit(8.1,.3).toFixed(1)+'%';
    alloc();
  },2000);

  /* theme toggle */
  $('#theme').addEventListener('click',()=>{
    document.body.classList.toggle('day');
    $('#theme-l').textContent=document.body.classList.contains('day')?'Mode nuit':'Mode jour';
  });
})();
</script>
</body>
</html>
