<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  :root{ --cyan:#00D4FF; --text:#F0F3FA; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1080px; background:transparent; overflow:hidden; font-family:'Outfit',sans-serif; }
  /* bandeau bas : y 787..1080 (293px) */
  #cap{
    position:absolute; left:60px; right:60px; top:865px;
    font-size:33px; font-weight:600; line-height:1.32; color:var(--text); text-align:center; opacity:0;
  }
</style></head>
<body>
<div id="cap"></div>
<script>
const SUBS=[
  { s:0.3,  e:3.55, t:"Je ne suis pas réelle.<br>Je suis une intelligence artificielle." },
  { s:3.55, e:8.0,  t:"Mais votre temps, ces heures perdues<br>chaque semaine ? Elles sont bien réelles." },
  { s:8.4,  e:12.0, t:"NOEZYS met l'IA au travail : du temps gagné,<br>un chiffre d'affaires qui grimpe." },
  { s:12.0, e:15.0, t:"Des solutions sur mesure,<br>faites pour vous." },
  { s:15.4, e:19.4, t:"Et voici ce que même une IA vous dira :<br>il vous faut une vraie équipe qui écoute." },
  { s:19.4, e:23.4, t:"Le contact humain avant tout." },
];
const cap=document.getElementById('cap');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
window.seek=function(t){
  let cur=null; for(const s of SUBS){ if(t>=s.s&&t<s.e){cur=s;break;} }
  if(!cur){ cap.style.opacity=0; return; }
  cap.innerHTML=cur.t;
  cap.style.opacity=Math.min(clamp((t-cur.s)/0.25,0,1), clamp((cur.e-t)/0.25,0,1));
};
window.seek(0);
</script>
</body></html>
