<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Outfit'; font-weight:500; src:url('fonts/outfit-500.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  :root{ --cyan:#00D4FF; --text:#F0F3FA; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:720px; background:transparent; overflow:hidden; font-family:'Outfit',sans-serif; }
  #cap{
    position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
    max-width:1120px; padding:13px 30px; border-radius:13px;
    background:rgba(10,14,26,.78); border:1px solid rgba(0,212,255,.20);
    backdrop-filter:blur(4px);
    font-size:29px; font-weight:600; line-height:1.34; color:var(--text); text-align:center;
    opacity:0; white-space:nowrap;
  }
</style></head>
<body>
<div id="cap"></div>
<script>
const SUBS=[
  // Clip 1 (0 - 8.04)
  { s:0.3,  e:3.55, t:"Je ne suis pas réelle. Je suis une intelligence artificielle." },
  { s:3.55, e:8.0,  t:"Mais votre temps, ces heures perdues chaque semaine ? Elles sont bien réelles." },
  // Clip 2 (8.04 - 15.08)
  { s:8.4,  e:12.0, t:"NOEZYS met l'IA au travail : du temps gagné, un chiffre d'affaires qui grimpe." },
  { s:12.0, e:15.0, t:"Des solutions sur mesure, faites pour vous." },
  // Clip 3 (15.08 - 22.12)
  { s:15.4, e:19.4, t:"Et voici ce que même une IA vous dira : il vous faut une vraie équipe qui écoute." },
  { s:19.4, e:22.0, t:"Le contact humain avant tout." },
];
const cap=document.getElementById('cap');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
window.seek=function(t){
  let cur=null;
  for(const s of SUBS){ if(t>=s.s && t<s.e){ cur=s; break; } }
  if(!cur){ cap.style.opacity=0; return; }
  cap.textContent=cur.t;
  const fin=clamp((t-cur.s)/0.25,0,1);
  const fout=clamp((cur.e-t)/0.25,0,1);
  cap.style.opacity=Math.min(fin,fout);
};
window.seek(0);
</script>
</body></html>
