<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1080px; overflow:hidden; font-family:'Outfit',sans-serif;
    background:radial-gradient(120% 80% at 50% 40%, #121734 0%, #0D1225 55%, #080b17 100%); }
  #top{ position:absolute; top:0; left:0; right:0; height:180px; display:flex; align-items:center; justify-content:center; gap:16px; }
  #top img{ width:54px; height:54px; }
  #top .wm{ font-size:40px; font-weight:600; letter-spacing:9px; padding-left:9px; color:#F0F3FA; }
</style></head>
<body>
  <div id="top">
    <img src="../assets/noezys-n-mark.png" alt="">
    <span class="wm">NOEZYS</span>
  </div>
</body></html>
