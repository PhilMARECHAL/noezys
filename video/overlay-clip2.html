<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Outfit'; font-weight:400; src:url('fonts/outfit-400.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:500; src:url('fonts/outfit-500.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:700; src:url('fonts/outfit-700.woff2') format('woff2'); }
  :root{ --nav:#0D1225; --cyan:#00D4FF; --purple:#8B5CF6; --green:#55B97E; --text:#F0F3FA; --text2:#8A96B4; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:720px; background:transparent; overflow:hidden; font-family:'Outfit',sans-serif; }
  #win{
    position:absolute; left:70px; top:150px; width:530px; height:430px;
    border-radius:22px; opacity:0; transform:translateY(24px) scale(.97);
    background:linear-gradient(180deg, rgba(18,24,48,.93), rgba(9,13,28,.95)) padding-box,
              linear-gradient(130deg, var(--cyan), var(--purple)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 40px rgba(0,212,255,.18);
    backdrop-filter:blur(3px); overflow:hidden;
  }
  #bar{ height:52px; display:flex; align-items:center; gap:9px; padding:0 20px; border-bottom:1px solid rgba(255,255,255,.07); }
  .dot{ width:12px; height:12px; border-radius:50%; }
  #bar .title{ margin-left:14px; font-size:20px; font-weight:600; color:var(--text); }
  #bar .title b{ background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #chat{ padding:22px; display:flex; flex-direction:column; gap:14px; }
  .msg{ max-width:78%; padding:14px 18px; border-radius:16px; font-size:21px; font-weight:500; line-height:1.35; opacity:0; }
  .msg.user{ align-self:flex-end; color:#08111f; background:linear-gradient(120deg,var(--cyan),#7FE3FF); border-bottom-right-radius:5px; transform:translateY(10px); }
  .msg.ai{ align-self:flex-start; color:var(--text); border-bottom-left-radius:5px; transform:translateY(10px);
           background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)) padding-box,
                     linear-gradient(90deg, var(--cyan), var(--purple)) border-box; border:1px solid transparent; }
  #typing{ align-self:flex-start; display:flex; gap:7px; padding:16px 20px; border-radius:16px; opacity:0;
           background:rgba(255,255,255,.05); }
  #typing i{ width:11px; height:11px; border-radius:50%; background:var(--text2); display:block; }
  #site{ position:absolute; left:22px; right:22px; bottom:20px; display:flex; align-items:center; gap:12px;
         padding:14px 18px; border-radius:14px; opacity:0; transform:translateY(12px);
         background:linear-gradient(180deg, rgba(85,185,126,.16), rgba(85,185,126,.06)) padding-box,
                   linear-gradient(90deg, var(--green), var(--cyan)) border-box; border:1px solid transparent; }
  #site .badge{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--green),var(--cyan)); display:flex; align-items:center; justify-content:center; }
  #site .badge svg{ width:16px; height:16px; }
  #site .u{ font-size:20px; font-weight:600; color:var(--text); }
  #site .u span{ color:var(--text2); font-weight:500; font-size:17px; }
</style></head>
<body>
<div id="win">
  <div id="bar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="title"><b>NOEZYS</b> · Your AI assistant</span>
  </div>
  <div id="chat">
    <div class="msg user" id="mUser">Hi, I'd like a quote for your services.</div>
    <div id="typing"><i></i><i></i><i></i></div>
    <div class="msg ai" id="mAi">Of course. Here's what we can offer.</div>
  </div>
  <div id="site">
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#08111f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span>
    <span class="u">atelier-nova.com <span>· Site ready</span></span>
  </div>
</div>
<script>
const win=document.getElementById('win'), mUser=document.getElementById('mUser'),
  typing=document.getElementById('typing'), mAi=document.getElementById('mAi'), site=document.getElementById('site');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=t=>1-Math.pow(1-t,3);
function show(el,t,start,dur){ const p=ease(clamp((t-start)/dur,0,1)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*10}px)`; return p; }
window.seek=function(t){
  const w=ease(clamp((t-0.15)/0.8,0,1));
  win.style.opacity=w; win.style.transform=`translateY(${(1-w)*24}px) scale(${0.97+w*0.03})`;
  show(mUser,t,0.9,0.5);
  // typing 1.9 → 3.0
  typing.style.opacity=(t>1.9&&t<3.0)?1:0;
  const bob=Math.sin(t*10);
  typing.querySelectorAll('i').forEach((d,i)=>d.style.transform=`translateY(${Math.sin(t*9+i*1.1)*3}px)`);
  show(mAi,t,3.1,0.5);
  show(site,t,4.6,0.7);
};
window.seek(0);
</script>
</body></html>
