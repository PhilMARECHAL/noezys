[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wankoe-model"
version = "0.1.0"
description = "Wankoe Python Model - limestone processing line calculation model (Noezys)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Noezys" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wankoe_model = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
