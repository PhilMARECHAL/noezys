<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<style>
  @font-face { font-family:'Outfit'; font-weight:400; src:url('fonts/outfit-400.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:500; src:url('fonts/outfit-500.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:600; src:url('fonts/outfit-600.woff2') format('woff2'); }
  @font-face { font-family:'Outfit'; font-weight:700; src:url('fonts/outfit-700.woff2') format('woff2'); }
  :root{ --nav:#0D1225; --cyan:#00D4FF; --purple:#8B5CF6; --green:#55B97E; --text:#F0F3FA; --text2:#8A96B4; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1280px; height:720px; background:transparent; overflow:hidden; font-family:'Outfit',sans-serif; }
  #stage{ position:absolute; inset:0; }

  /* Fenêtre interactive gauche */
  #win{
    position:absolute; left:70px; top:150px; width:520px; height:430px;
    border-radius:22px; opacity:0; transform:translateY(24px) scale(.97);
    background:
      linear-gradient(180deg, rgba(18,24,48,.93), rgba(9,13,28,.95)) padding-box,
      linear-gradient(130deg, var(--cyan), var(--purple)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 40px rgba(0,212,255,.18);
    backdrop-filter:blur(3px); overflow:hidden;
  }
  #bar{ height:52px; display:flex; align-items:center; gap:9px; padding:0 20px;
        border-bottom:1px solid rgba(255,255,255,.07); }
  .dot{ width:12px; height:12px; border-radius:50%; }
  #bar .title{ margin-left:14px; font-size:20px; font-weight:600; color:var(--text); letter-spacing:.3px; }
  #bar .title b{ background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #body{ padding:22px 22px 0; }
  .head{ font-size:15px; font-weight:600; letter-spacing:2px; color:var(--text2); text-transform:uppercase; margin-bottom:16px; }

  .row{ display:flex; align-items:center; gap:16px; padding:11px 14px; margin-bottom:11px;
        border-radius:13px; opacity:0; transform:translateX(-16px);
        background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)) padding-box,
                  linear-gradient(90deg, rgba(0,212,255,.5), rgba(139,92,246,.5)) border-box;
        border:1px solid transparent; }
  .row svg{ width:30px; height:30px; flex:0 0 auto; }
  .row .lbl{ font-size:22px; font-weight:600; color:var(--text); white-space:nowrap; }
  .row .chk{ margin-left:auto; width:22px; height:22px; border-radius:50%;
             background:linear-gradient(135deg,var(--cyan),var(--purple)); opacity:0;
             display:flex; align-items:center; justify-content:center; }
  .row .chk svg{ width:13px; height:13px; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gbrand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
</defs></svg>
<div id="stage">
  <div id="win">
    <div id="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="title"><b>NOEZYS</b> · AI Studio</span>
    </div>
    <div id="body">
      <div class="head">Built around your business</div>
      <div id="rows"></div>
    </div>
  </div>
</div>

<script>
const ICONS = {
  devis: `<svg viewBox="0 0 48 48" fill="none" stroke="url(#gbrand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 h16 l8 8 v28 h-24 z"/><path d="M28 6 v8 h8"/><line x1="18" y1="24" x2="30" y2="24"/><line x1="18" y1="31" x2="30" y2="31"/></svg>`,
  chatbot: `<svg viewBox="0 0 48 48" fill="none" stroke="url(#gbrand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12 a6 6 0 0 1 6 -6 h20 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-14 l-8 8 v-8 h-4 a6 6 0 0 1 -6 -6 z" transform="translate(4 3)"/><circle cx="19" cy="22" r="1.6" fill="url(#gbrand)" stroke="none"/><circle cx="27" cy="22" r="1.6" fill="url(#gbrand)" stroke="none"/><circle cx="35" cy="22" r="1.6" fill="url(#gbrand)" stroke="none"/></svg>`,
  web: `<svg viewBox="0 0 48 48" fill="none" stroke="url(#gbrand)" stroke-width="2.6" stroke-linecap="round"><circle cx="24" cy="24" r="17"/><ellipse cx="24" cy="24" rx="8" ry="17"/><line x1="7" y1="24" x2="41" y2="24"/></svg>`,
  mobile: `<svg viewBox="0 0 48 48" fill="none" stroke="url(#gbrand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="5" width="20" height="38" rx="4"/><line x1="21" y1="37" x2="27" y2="37"/></svg>`,
  ia: `<svg viewBox="0 0 48 48" fill="none" stroke="url(#gbrand)" stroke-width="2.4" stroke-linecap="round"><circle cx="24" cy="24" r="5"/><circle cx="9" cy="12" r="3.4"/><circle cx="39" cy="12" r="3.4"/><circle cx="9" cy="37" r="3.4"/><circle cx="39" cy="37" r="3.4"/><line x1="12" y1="14.5" x2="20" y2="21"/><line x1="36" y1="14.5" x2="28" y2="21"/><line x1="12" y1="34.5" x2="20" y2="27"/><line x1="36" y1="34.5" x2="28" y2="27"/></svg>`,
};
const CHK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>`;
const SERVICES = [
  { icon:'devis',   lbl:'Instant quotes' },
  { icon:'chatbot', lbl:'Customer chatbot' },
  { icon:'web',     lbl:'Custom websites' },
  { icon:'mobile',  lbl:'Mobile apps' },
  { icon:'ia',      lbl:'100% custom AI' },
];
const rowsWrap = document.getElementById('rows');
const rows = SERVICES.map(s=>{
  const el=document.createElement('div'); el.className='row';
  el.innerHTML=`${ICONS[s.icon]}<span class="lbl">${s.lbl}</span><span class="chk">${CHK}</span>`;
  rowsWrap.appendChild(el); return el;
});
const win=document.getElementById('win');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,3);

window.seek=function(t){
  // Fenêtre : apparition 0.2 → 1.1s
  const w=ease(clamp((t-0.2)/0.9,0,1));
  win.style.opacity=w;
  win.style.transform=`translateY(${(1-w)*24}px) scale(${0.97+w*0.03})`;

  // Services en cascade : de 1.2s, un toutes les 0.85s
  rows.forEach((el,i)=>{
    const start=1.2+i*0.85;
    const p=ease(clamp((t-start)/0.55,0,1));
    el.style.opacity=p;
    el.style.transform=`translateX(${(1-p)*-16}px)`;
    // check qui valide 0.35s après l'entrée
    const c=el.querySelector('.chk');
    c.style.opacity=ease(clamp((t-(start+0.4))/0.3,0,1));
    c.style.transform=`scale(${0.6+0.4*ease(clamp((t-(start+0.4))/0.3,0,1))})`;
  });
};
window.seek(0);
</script>
</body></html>
